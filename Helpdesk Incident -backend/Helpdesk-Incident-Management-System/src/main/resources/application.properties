spring.application.name=Helpdesk-Incident-Management-System

server.port=${PORT:8080}

spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://mongo:27017/helpdesk_db}
spring.mongodb.auto-index-creation=true

app.admin.email=${ADMIN_EMAIL:admin@helpdesk.local}
app.admin.password=${ADMIN_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}